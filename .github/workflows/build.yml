name: Build distributables

# Manual run from the Actions tab, plus auto-run on version tags (vX.Y / vX.Y.Z).
# Tag-triggered runs still upload as workflow artifacts — no Release is created
# automatically; that can be added later if/when the project starts cutting
# real Releases on GitHub.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

env:
  # Bump this to upgrade Ren'Py; the SDK cache key incorporates it, so a new
  # version forces a fresh download.
  RENPY_VERSION: 8.5.3

jobs:
  build:
    name: PC + Mac + Web (single macOS runner)
    runs-on: macos-latest
    permissions:
      # `write` is required only for the tag-triggered Release step at the
      # end. On manual runs the step is skipped and no writes happen, so
      # this remains the minimum scope.
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The SDK tarball is ~146 MB. Cache the extracted dir so subsequent
      # runs skip the download entirely.
      - name: Cache Ren'Py SDK
        id: cache-renpy
        uses: actions/cache@v4
        with:
          path: ~/renpy-sdk
          key: renpy-sdk-${{ env.RENPY_VERSION }}-v1

      - name: Download and extract Ren'Py SDK
        if: steps.cache-renpy.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/renpy-sdk
          curl -fSL \
            "https://www.renpy.org/dl/${RENPY_VERSION}/renpy-${RENPY_VERSION}-sdk.tar.bz2" \
            -o /tmp/renpy-sdk.tar.bz2
          tar -xjf /tmp/renpy-sdk.tar.bz2 -C ~/renpy-sdk --strip-components=1
          rm /tmp/renpy-sdk.tar.bz2

      # Ren'Py's browser export is a separate SDK add-on. The plain
      # `--package web` distributor package is not the HTML5/itch.io build;
      # `web_build` below creates the playable archive with index.html.
      - name: Install RenPyWeb support
        run: |
          set -euo pipefail
          if [ ! -d ~/renpy-sdk/web ]; then
            curl -fSL \
              "https://www.renpy.org/dl/${RENPY_VERSION}/renpy-${RENPY_VERSION}-web.zip" \
              -o /tmp/renpy-web.zip
            unzip -q /tmp/renpy-web.zip -d ~/renpy-sdk
            rm /tmp/renpy-web.zip
          fi

      # Lint catches indentation errors, missing labels, broken jumps —
      # cheaper to fail here than after a 5-minute build.
      - name: Lint project
        run: ~/renpy-sdk/renpy.sh "$GITHUB_WORKSPACE" lint

      # Produces two zips under ../MOGMAX-<version>-dists/ (Ren'Py default):
      #   - MOGMAX-<version>-pc.zip  (Windows + Linux binaries + game/ + renpy/)
      #   - MOGMAX-<version>-mac.zip (MOGMAX.app)
      - name: Build PC + Mac packages
        run: |
          ~/renpy-sdk/renpy.sh ~/renpy-sdk/launcher distribute "$GITHUB_WORKSPACE" \
            --package pc --package mac

      - name: Locate dist directory
        id: dists
        run: |
          set -euo pipefail
          dist_dir=$(find "$(dirname "$GITHUB_WORKSPACE")" -maxdepth 1 -type d -name 'MOGMAX-*-dists' | head -n1)
          if [ -z "$dist_dir" ]; then
            echo "::error::dist directory not found under $(dirname "$GITHUB_WORKSPACE")"
            find "$(dirname "$GITHUB_WORKSPACE")" -maxdepth 2 -type d
            exit 1
          fi
          echo "dist_dir=$dist_dir" >> "$GITHUB_OUTPUT"
          ls -lh "$dist_dir"

      # Signing is optional in CI: it only runs when the four MACOS_* secrets
      # are configured. Everything below keys off this one flag.
      - name: Detect signing availability
        id: signing
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
        run: |
          if [ -n "$CERT_P12" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No MACOS_CERT_P12 secret — the Mac build will NOT be signed or notarized, and the .dmg will be withheld from any published Release. See tools/release_mac.sh to build a signed .dmg locally."
          fi

      # Import the Developer ID cert into a throwaway keychain scoped to this
      # runner. A dedicated keychain (rather than the default login one) is
      # what lets us set the partition list so codesign can use the key
      # non-interactively — without that, signing hangs on an invisible GUI
      # password prompt and the job times out.
      - name: Import signing certificate
        if: steps.signing.outputs.enabled == 'true'
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/signing.keychain-db"
          # Ephemeral runner, ephemeral keychain — this password guards nothing
          # beyond the life of the job.
          kc_pass="$(uuidgen)"

          security create-keychain -p "$kc_pass" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$kc_pass" "$keychain"

          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" \
            -k "$keychain" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: -s -k "$kc_pass" "$keychain" >/dev/null
          # Prepend to the search list so find-identity sees it.
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

          security find-identity -v -p codesigning "$keychain"

      # Store notarytool credentials under the same profile name the local
      # script uses, so both paths call notarytool identically.
      - name: Store notarization credentials
        if: steps.signing.outputs.enabled == 'true'
        env:
          APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
          APP_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: |
          set -euo pipefail
          xcrun notarytool store-credentials mogmax-notary \
            --apple-id "$APPLE_ID" \
            --team-id "$TEAM_ID" \
            --password "$APP_PASSWORD"

      # Reuse the exact same script that produces local releases, so CI and
      # local builds cannot drift apart in how they sign.
      - name: Sign, notarize and staple the .dmg
        if: steps.signing.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          RENPY_SDK="$HOME/renpy-sdk" "$GITHUB_WORKSPACE/tools/release_mac.sh" --skip-build

      # Unsigned fallback so manual (non-Release) runs still get something
      # testable to download. This .dmg WILL trigger Gatekeeper and is
      # deliberately excluded from published Releases further down.
      - name: Wrap Mac .app into an unsigned .dmg
        if: steps.signing.outputs.enabled != 'true'
        run: |
          set -euo pipefail
          dist_dir="${{ steps.dists.outputs.dist_dir }}"
          mac_zip=$(ls "$dist_dir"/MOGMAX-*-mac.zip | head -n1)
          dmg_path="${mac_zip%.zip}.dmg"
          stage=$(mktemp -d)
          unzip -q "$mac_zip" -d "$stage"
          hdiutil create \
            -volname "MOGMAX" \
            -srcfolder "$stage" \
            -ov -format UDZO \
            "$dmg_path"
          ls -lh "$dmg_path"

      # Produces ../MOGMAX-<version>-dists/MOGMAX-<version>-web.zip, an
      # HTML5 package with index.html at the root for itch.io browser play.
      - name: Build Web / itch.io package
        run: |
          set -euo pipefail
          dist_dir="${{ steps.dists.outputs.dist_dir }}"
          web_name="$(basename "$dist_dir" -dists)-web"
          ~/renpy-sdk/renpy.sh ~/renpy-sdk/launcher web_build "$GITHUB_WORKSPACE" \
            --destination "$dist_dir/$web_name"

      # Upload as four named artifacts so the Actions UI lets you grab each
      # one with a single click instead of one huge bundle.
      #
      # The PC zip doubles as the Ren'Py Pocket package (it contains both
      # game/ and renpy/ at the zip root, which is what Pocket loads). Same
      # file, two uses — no separate mobile build needed.
      - name: Upload Windows + Pocket (PC zip)
        uses: actions/upload-artifact@v4
        with:
          name: MOGMAX-windows-and-pocket
          path: ${{ steps.dists.outputs.dist_dir }}/MOGMAX-*-pc.zip
          if-no-files-found: error
          retention-days: 90

      - name: Upload Mac (.dmg)
        uses: actions/upload-artifact@v4
        with:
          name: MOGMAX-mac-dmg
          path: ${{ steps.dists.outputs.dist_dir }}/MOGMAX-*-mac.dmg
          if-no-files-found: error
          retention-days: 90

      - name: Upload Mac (.zip, fallback if .dmg gives anyone trouble)
        uses: actions/upload-artifact@v4
        with:
          name: MOGMAX-mac-zip
          path: ${{ steps.dists.outputs.dist_dir }}/MOGMAX-*-mac.zip
          if-no-files-found: error
          retention-days: 90

      - name: Upload Web / itch.io (HTML5 zip)
        uses: actions/upload-artifact@v4
        with:
          name: MOGMAX-web-itch
          path: ${{ steps.dists.outputs.dist_dir }}/MOGMAX-*-web.zip
          if-no-files-found: error
          retention-days: 90

      # Tag-only step: publish a public GitHub Release with the four files
      # attached as assets. The Release page has direct download links that
      # don't require the visitor to be signed into GitHub — which is the
      # whole point of the v* tag workflow.
      #
      # Trigger this by pushing a tag like v2.0 or v2.0.1:
      #   git tag v2.0 && git push origin v2.0
      - name: Publish GitHub Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          dist_dir="${{ steps.dists.outputs.dist_dir }}"
          tag="${GITHUB_REF#refs/tags/}"

          assets=(
            "$dist_dir"/MOGMAX-*-pc.zip
            "$dist_dir"/MOGMAX-*-web.zip
          )

          # Only publish the Mac build when it is actually signed and
          # notarized. Attaching an unsigned .dmg to a public Release is worse
          # than attaching nothing: players hit the "damaged / unidentified
          # developer" dialog, assume the game is broken, and bounce. If this
          # fires, build the Mac release locally with tools/release_mac.sh and
          # upload it to the Release by hand.
          if [ "${{ steps.signing.outputs.enabled }}" = "true" ]; then
            assets+=(
              "$dist_dir"/MOGMAX-*-mac.dmg
              "$dist_dir"/MOGMAX-*-mac.zip
            )
          else
            echo "::warning::Publishing without the Mac build — no signing secrets configured."
          fi

          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --title "MOGMAX $tag" \
            --generate-notes \
            "${assets[@]}"
